name: Validate

# main is live: Argo CD applies every commit. This flags a broken or unsafe commit, including the
# image bumps that the app repositories' CI pushes.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  manifests:
    runs-on: docker
    timeout-minutes: 15
    env:
      KUBECTL_VERSION: v1.36.4
      KUBECTL_SHA256: 8b8f088da2dab964f853b38464033b1be15ede2839eca751482357c45abdd05a
      KUBECONFORM_VERSION: v0.8.0
      KUBECONFORM_SHA256: 9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
    steps:
      - name: Check out
        # v4.4.0, pinned by commit so a moved tag cannot change what runs here.
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Install kubectl and kubeconform
        run: |
          set -eu
          cd "$(mktemp -d)"
          curl -fsSLo kubectl "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl"
          echo "$KUBECTL_SHA256  kubectl" | sha256sum -c -
          install -m 0755 kubectl /usr/local/bin/kubectl
          curl -fsSLO "https://github.com/yannh/kubeconform/releases/download/$KUBECONFORM_VERSION/kubeconform-linux-amd64.tar.gz"
          echo "$KUBECONFORM_SHA256  kubeconform-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf kubeconform-linux-amd64.tar.gz kubeconform
          install -m 0755 kubeconform /usr/local/bin/kubeconform

      - name: Build, validate and check policy
        run: ./.forgejo/scripts/validate-manifests.sh

  secrets:
    runs-on: docker
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out
        uses: https://github.com/actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          # Full history: a secret removed in a later commit is still public.
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          set -eu
          cd "$(mktemp -d)"
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive"
          echo "$GITLEAKS_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Scan history for secrets
        run: gitleaks git --redact --no-banner --config .gitleaks.toml .
