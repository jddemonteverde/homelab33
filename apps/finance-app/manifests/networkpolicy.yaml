# The app makes no outbound network calls by design, so egress is closed entirely.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: finance-app
  namespace: finance-app
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
      ports:
        - protocol: TCP
          port: 3000
