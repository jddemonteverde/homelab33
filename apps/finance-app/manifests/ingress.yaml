apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: finance-app
  namespace: finance-app
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: finance-app-tailnet-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: finance.lab.jddemonteverde.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: finance-app
                port:
                  number: 3000
