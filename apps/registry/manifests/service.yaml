apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: registry
  labels:
    app: registry
spec:
  type: ClusterIP
  # Pinned: image references and each node's registries.yaml use this address,
  # because containerd pulls from the host and cannot resolve cluster DNS.
  clusterIP: 10.43.200.10
  selector:
    app: registry
  ports:
    - name: http
      port: 5000
      targetPort: http
