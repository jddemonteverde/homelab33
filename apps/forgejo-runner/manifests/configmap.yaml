apiVersion: v1
kind: ConfigMap
metadata:
  name: forgejo-runner-config
  namespace: forgejo-runner
data:
  config.yml: |
    runner:
      labels:
        - docker:docker://data.forgejo.org/oci/node:24-trixie
        - ubuntu-latest:docker://data.forgejo.org/oci/node:24-trixie
    container:
      # No Docker socket in jobs: with it, a job can start a privileged container and
      # take over the node. Images are built by buildkitd instead.
      docker_host: "-"
