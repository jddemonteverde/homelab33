apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pihole
  namespace: pihole
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pihole-tailnet-only@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: pihole.lab.jddemonteverde.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pihole
                port:
                  number: 8080
