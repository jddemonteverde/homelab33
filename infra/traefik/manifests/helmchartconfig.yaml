# k3s installs Traefik from its bundled chart; a HelmChartConfig overrides that chart's values.
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    # Off the CI node; see "Node placement" in AGENTS.md.
    nodeSelector:
      node-role.kubernetes.io/control-plane: "true"
    # No LAN listener: k3s's ServiceLB only exposes LoadBalancer Services on the nodes. Traefik is
    # reached through the Tailscale proxy (infra/tailscale-proxy) and, in-cluster, by its Service.
    service:
      spec:
        type: ClusterIP
    # A ClusterIP Service has no load-balancer address to publish, which left every Ingress without
    # one and Argo CD reporting them Progressing. Write the public lab name instead; it changes no routing.
    providers:
      kubernetesIngress:
        publishedService:
          enabled: false
    additionalArguments:
      - --providers.kubernetesingress.ingressendpoint.hostname=lab.jddemonteverde.com
    ports:
      web:
        http:
          redirections:
            entryPoint:
              to: websecure
              scheme: https
              permanent: true
