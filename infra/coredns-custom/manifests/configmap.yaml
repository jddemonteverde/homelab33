# k3s's CoreDNS imports *.override keys from this ConfigMap. Forgejo hands Actions jobs its
# ROOT_URL for checkout; this keeps that lookup in-cluster, straight to Traefik, which serves the
# wildcard certificate. Publicly the lab name points at a Tailscale address pods can't reach.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  forgejo.override: |
    rewrite stop {
      name exact forgejo.lab.jddemonteverde.com traefik.kube-system.svc.cluster.local
      answer auto
    }
