# k3s's CoreDNS imports *.override keys from this ConfigMap. Forgejo hands
# Actions jobs its ROOT_URL for checkout; this keeps that in-cluster via Traefik.
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
data:
  forgejo.override: |
    rewrite stop {
      name exact forgejo.homelab.local traefik.kube-system.svc.cluster.local
      answer auto
    }
