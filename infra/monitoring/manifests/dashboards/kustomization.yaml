apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
# Grafana's sidecar loads every ConfigMap in the namespace that carries this label.
generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"
configMapGenerator:
  - name: dashboard-homelab-nodes
    files:
      - homelab-nodes.json
